<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #1b5e20, #4caf50);
        color: white;
        display: flex;
        flex-direction: column;
        height: 100vh;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    h1 {
        font-size: 32px;
        margin-bottom: 10px;
    }

    p {
        font-size: 16px;
        opacity: 0.9;
        margin-bottom: 30px;
    }

    .menu {
        display: flex;
        flex-direction: column;
        gap: 15px;
        width: 80%;
        max-width: 300px;
    }

    button {
        padding: 15px;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        cursor: pointer;
        background: white;
        color: #1b5e20;
        font-weight: bold;
        transition: 0.3s;
    }

    button:hover {
        background: #c8e6c9;
        transform: scale(1.05);
    }

    footer {
        position: absolute;
        bottom: 10px;
        font-size: 12px;
        opacity: 0.7;
    }
</style>
</head>

<body>

<h1>📦 Estoque</h1>
<p>Controle simples e rápido dos seus produtos</p>

<div class="menu">
    <button onclick="alert('Abrir cadastro de produtos')">
        ➕ Cadastrar Produto
    </button>

    <button onclick="alert('Ver lista de produtos')">
        📋 Ver Estoque
    </button>

    <button onclick="alert('Relatórios em breve')">
        📊 Relatórios
    </button>
</div>

<footer>
    Desenvolvido por João Divino Barbosa
</footer>

</body>
</html>
